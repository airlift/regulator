name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow=${{ github.workflow }},ref=${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check-commits-dispatcher:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit descriptions
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid pull request base ref: $BASE_REF" >&2
            exit 1
          fi
          python3 .github/scripts/check-commit-descriptions.py \
            "origin/${BASE_REF}..HEAD"

      - name: Select earlier commits
        id: set-matrix
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid pull request base ref: $BASE_REF" >&2
            exit 1
          fi

          commits=$(git rev-list --reverse "origin/${BASE_REF}..HEAD")
          lines_to_drop=1
          if [[ -n "$commits" ]]; then
            last_commit=$(tail -n 1 <<< "$commits")
            if [[ $(git show -s --format='%P' "$last_commit" | wc -w) -gt 1 ]]; then
              lines_to_drop=2
            fi
          fi

          matrix=$(head -n "-${lines_to_drop}" <<< "$commits" |
            jq -R -s -c 'split("\n") | map(select(length > 0)) | map({commit: .})')
          if [[ "$matrix" == "[]" ]]; then
            echo "matrix=" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":${matrix}}" >> "$GITHUB_OUTPUT"
          fi

  check-commit:
    if: github.event_name == 'pull_request' && needs.check-commits-dispatcher.outputs.matrix != ''
    needs: check-commits-dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check-commits-dispatcher.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ matrix.commit }}

      - name: Compute tree hash
        id: tree
        run: echo "hash=$(git rev-parse HEAD:)" >> "$GITHUB_OUTPUT"

      - name: Restore compile result
        id: compile-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: compile-commit-success.txt
          key: compile-commit-${{ github.event.pull_request.head.repo.full_name }}-${{ steps.tree.outputs.hash }}

      - name: Install Java
        if: steps.compile-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Compile commit
        if: steps.compile-cache.outputs.cache-hit != 'true'
        run: ./mvnw clean package -B -V -DskipTests -Dair.check.skip-all

      - name: Record compile success
        if: steps.compile-cache.outputs.cache-hit != 'true'
        run: echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > compile-commit-success.txt

  test-commit-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test commit description checker
        run: python3 .github/scripts/test-check-commit-descriptions.py

  build:
    name: Build (Java ${{ matrix.java-version }}, native access ${{ matrix.native-access }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version:
          - 25
          - 26
        native-access:
          - disabled
          - enabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build
        env:
          NATIVE_ACCESS: ${{ matrix.native-access }}
        run: |
          arguments=()
          if [[ "$NATIVE_ACCESS" == enabled ]]; then
            arguments+=("-Dregulator.nativeAccessJvmArgument=--enable-native-access=ALL-UNNAMED")
          fi
          ./mvnw clean install -B -V -P ci "${arguments[@]}"

  ci-success:
    if: always()
    needs:
      - check-commits-dispatcher
      - check-commit
      - test-commit-checker
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECK_COMMIT_RESULT: ${{ needs.check-commit.result }}
          CHECKER_TEST_RESULT: ${{ needs.test-commit-checker.result }}
          DISPATCHER_RESULT: ${{ needs.check-commits-dispatcher.result }}
        run: |
          if [[ "$BUILD_RESULT" != success ]] ||
              [[ "$CHECK_COMMIT_RESULT" == failure || "$CHECK_COMMIT_RESULT" == cancelled ]] ||
              [[ "$CHECKER_TEST_RESULT" != success ]] ||
              [[ "$DISPATCHER_RESULT" == failure || "$DISPATCHER_RESULT" == cancelled ]]; then
            echo "CI failed: build=$BUILD_RESULT check-commit=$CHECK_COMMIT_RESULT checker-test=$CHECKER_TEST_RESULT dispatcher=$DISPATCHER_RESULT" >&2
            exit 1
          fi
