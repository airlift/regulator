version: 2
updates:
  - package-ecosystem: npm
    directory: /benchmark-report
    schedule:
      interval: weekly
    labels:
      - dependency
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
    labels:
      - dependency
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependency
    open-pull-requests-limit: 5
